<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Short Vowel Game</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            touch-action: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            background: radial-gradient(circle, #2a2a40 0%, #151522 100%);
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        .box {
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #4ecca3;
            text-align: center;
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #4ecca3;
            text-transform: uppercase;
        }
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            width: 85%;
            max-width: 400px;
        }
        #start-screen { border: 2px solid #4ecca3; }
        #game-over { display: none; border: 2px solid #f72585; }
        button {
            background: #4ecca3;
            color: #1e1e2f;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background: #38b28a; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="box">
            <h2>Short Vowel Proofreader</h2>
            <div>Score: <span id="score">0</span></div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="modal">
        <h2 style="font-size: 24px;">Phonics.io</h2>
        <p>Eat <b>REAL</b> short vowel words. Avoid <b>FAKE nonsense</b> spelling traps!</p>
        <button onclick="startGame()">Click to Start Game</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="modal">
        <h2 style="color: #f72585; font-size: 24px;">Nonsense Trap Hit!</h2>
        <p id="error-msg" style="font-size: 16px; line-height: 1.4;"></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // Word Bank: Guaranteed REAL short vowel words vs CLEAR fake nonsense traps
        const PAIRS = [
            // Short A
            { c: "cat",  w: "katt" },
            { c: "map",  w: "mapp" },
            { c: "van",  w: "vann" },
            { c: "trap", w: "trapp" },
            { c: "crab", w: "krab" },

            // Short E
            { c: "bed",  w: "beed" },
            { c: "pen",  w: "penn" },
            { c: "red",  w: "redd" },
            { c: "leg",  w: "legg" },

            // Short I
            { c: "pig",  w: "pyg" },
            { c: "fin",  w: "fynn" },
            { c: "sit",  w: "sitt" },
            { c: "swim", w: "swym" },

            // Short O
            { c: "mop",  w: "mopp" },
            { c: "pot",  w: "pott" },
            { c: "fox",  w: "foks" },
            { c: "frog", w: "frogg" },

            // Short U
            { c: "sun",  w: "sonn" },
            { c: "bus",  w: "buss" },
            { c: "cup",  w: "cupp" },
            { c: "drum", w: "drumm" }
        ];

        let player = { x: window.innerWidth / 2, y: window.innerHeight / 2, r: 28, score: 0 };
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let bubbles = [];
        let isPlaying = false;
        let isGameOver = false;

        function updatePointer(e) {
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            if (clientX !== undefined && clientY !== undefined) {
                mouse.x = clientX;
                mouse.y = clientY;
            }
        }

        window.addEventListener("mousemove", updatePointer);
        window.addEventListener("touchmove", updatePointer);
        window.addEventListener("touchstart", updatePointer);

        function spawn(isCorrect) {
            let p = PAIRS[Math.floor(Math.random() * PAIRS.length)];
            let radius = 28;
            bubbles.push({
                x: Math.random() * (canvas.width - radius * 4) + radius * 2,
                y: Math.random() * (canvas.height - radius * 4) + radius * 2,
                r: radius,
                word: isCorrect ? p.c : p.w,
                valid: isCorrect,
                correct: p.c
            });
        }

        function init() {
            bubbles = [];
            for (let i = 0; i < 6; i++) spawn(true);
            for (let i = 0; i < 6; i++) spawn(false);
        }

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            isPlaying = true;
            resetGame();
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.r = 28;
            player.score = 0;
            isGameOver = false;
            document.getElementById("score").textContent = "0";
            document.getElementById("game-over").style.display = "none";
            init();
            loop();
        }

        function update() {
            if (!isPlaying || isGameOver) return;

            player.x += (mouse.x - player.x) * 0.08;
            player.y += (mouse.y - player.y) * 0.08;

            player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
            player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                if (Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.r) {
                    if (b.valid) {
                        player.score += 10;
                        player.r += 1;
                        document.getElementById("score").textContent = player.score;
                        bubbles.splice(i, 1);
                        spawn(true);
                    } else {
                        isGameOver = true;
                        document.getElementById("error-msg").innerHTML = 
                            `<strong>"${b.word.toUpperCase()}"</strong> is a fake nonsense word!<br>Correct spelling: <strong>"${b.correct.toUpperCase()}"</strong>`;
                        document.getElementById("game-over").style.display = "block";
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = "#3a3a5c";
                ctx.fill();
                ctx.strokeStyle = "#4ecca3";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(b.word, b.x, b.y);
            });

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fillStyle = "#4ecca3";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            if (isPlaying && !isGameOver) requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
