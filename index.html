<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Short Vowel Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            touch-action: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            background: radial-gradient(circle, #2a2a40 0%, #151522 100%);
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        .box {
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #4ecca3;
            text-align: center;
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #4ecca3;
            text-transform: uppercase;
        }
        .score-text {
            font-size: 16px;
            font-weight: bold;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 25px 35px;
            border-radius: 15px;
            border: 2px solid #f72585;
            text-align: center;
            z-index: 20;
            box-shadow: 0 0 20px rgba(247, 37, 133, 0.4);
        }
        button {
            background: #4ecca3;
            color: #1e1e2f;
            border: none;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #38b28a;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="box">
            <h2>Collect Correct Short Vowel Words!</h2>
            <div class="score-text">Score: <span id="score">0</span></div>
        </div>
    </div>

    <div id="game-over">
        <h2 style="color: #f72585; font-size: 24px;">Vowel Error Hit!</h2>
        <p id="error-msg" style="font-size: 16px; line-height: 1.4;"></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        const PAIRS = [
            { c: "cat", w: "cet" }, { c: "map", w: "mep" }, { c: "van", w: "ven" },
            { c: "bed", w: "bad" }, { c: "pen", w: "pan" }, { c: "red", w: "rad" },
            { c: "pig", w: "peg" }, { c: "fin", w: "fen" }, { c: "sit", w: "set" },
            { c: "mop", w: "mup" }, { c: "pot", w: "put" }, { c: "fox", w: "fux" },
            { c: "sun", w: "sonn" }, { c: "bus", w: "bos" }, { c: "cup", w: "cop" }
        ];

        let player = { x: window.innerWidth / 2, y: window.innerHeight / 2, r: 28, score: 0 };
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let bubbles = [];
        let isGameOver = false;

        // Pointer controls (works for both mouse and touch)
        function updatePointer(e) {
            if (e.touches && e.touches[0]) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            } else {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }
        }
        window.addEventListener("mousemove", updatePointer);
        window.addEventListener("touchmove", updatePointer);
        window.addEventListener("touchstart", updatePointer);

        function spawn(isCorrect) {
            let p = PAIRS[Math.floor(Math.random() * PAIRS.length)];
            let radius = 28;
            bubbles.push({
                x: Math.random() * (canvas.width - radius * 4) + radius * 2,
                y: Math.random() * (canvas.height - radius * 4) + radius * 2,
                r: radius,
                word: isCorrect ? p.c : p.w,
                valid: isCorrect,
                correct: p.c
            });
        }

        function init() {
            bubbles = [];
            for (let i = 0; i < 6; i++) spawn(true);
            for (let i = 0; i < 6; i++) spawn(false);
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.r = 28;
            player.score = 0;
            isGameOver = false;
            document.getElementById("score").textContent = "0";
            document.getElementById("game-over").style.display = "none";
            init();
            loop();
        }

        function update() {
            if (isGameOver) return;

            player.x += (mouse.x - player.x) * 0.08;
            player.y += (mouse.y - player.y) * 0.08;

            player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
            player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                if (Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.r) {
                    if (b.valid) {
                        player.score += 10;
                        player.r += 1;
                        document.getElementById("score").textContent = player.score;
                        bubbles.splice(i, 1);
                        spawn(true);
                    } else {
                        isGameOver = true;
                        document.getElementById("error-msg").innerHTML = 
                            `<strong>"${b.word.toUpperCase()}"</strong> is incorrect!<br>Correct spelling: <strong>"${b.correct.toUpperCase()}"</strong>`;
                        document.getElementById("game-over").style.display = "block";
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = "#3a3a5c";
                ctx.fill();
                ctx.strokeStyle = "#4ecca3";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(b.word, b.x, b.y
